<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShifaTime — Medicine &amp; Water Reminder</title>
  <meta name="description" content="Never miss a dose and stay hydrated. ShifaTime is a free, 100% offline medicine and water reminder app for Android.">
  <meta name="theme-color" content="#2FAC66">

  <!-- Social share preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="ShifaTime — Medicine &amp; Water Reminder">
  <meta property="og:description" content="Remember. Hydrate. Stay consistent. Free on Google Play.">
  <meta property="og:image" content="assets/assets/images/img.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Chrome on Android: suggest the native app -->
  <meta name="google-play-app" content="app-id=com.abirdev.shifatime">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ShifaTime">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1E7D4A; font-weight: 700; font-size: 22px;
    }
    #loading img { width: 72px; height: 72px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.9); opacity: .7; } }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <span>ShifaTime</span>
  </div>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      onEntrypointLoaded: async function (engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
        document.getElementById('loading')?.remove();
      }
    });
  </script>
</body>
</html>
